[project]
name = "nodc_bvol"
version = "0.1.0"
description = "Handling translations with nomp list etc."
authors = [
    {name = "Magnus Wenzer", email = "magnus.wenzer@smhi.se"},
]
dependencies = [
    "requests>=2.31.0",
    "polars>=1.26.0",
    "numpy>=2.2.5",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mypkg = ["."]

[dependency-groups]
dev = [
    "ruff>=0.14.9",
]
